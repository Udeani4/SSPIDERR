# Render Blueprint for SSPIDERR - https://render.com/docs/blueprint-spec
#
# How to use: Render dashboard -> New -> Blueprint -> pick this GitHub repo.
# Render reads this file, creates the web app and its database, and asks you
# once for every value marked `sync: false` (copy them from SSPIDERR-APP/.env).
#
# Free plan notes:
#  - The app sleeps after 15 minutes without visitors; the next visit takes
#    about a minute to wake it. Missed daily refreshes catch up on wake-up.
#  - Files on the server (uploads, cache) are temporary. That's fine: uploads
#    are processed straight away and the cache rebuilds itself.
#  - Accounts, comments, reviews and news live in the free PostgreSQL database
#    below, which survives restarts but EXPIRES 30 DAYS after it is created
#    unless you upgrade it to a paid plan.

databases:
  - name: sspiderr-db
    plan: free
    region: frankfurt            # closest Render region to Nigeria; keep it the same as the web app
    databaseName: sspiderr
    user: sspiderr

services:
  - type: web
    name: sspiderr
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: SSPIDERR-APP        # the app lives in this folder of the repo
    buildCommand: pip install -r requirements.txt
    # The free plan has no pre-deploy step, so database migrations run at start-up.
    # They are safe to repeat: if nothing changed, they do nothing.
    startCommand: flask --app main db upgrade && python serve.py
    healthCheckPath: /healthz
    autoDeploy: true             # redeploy whenever you push to main
    envVars:
      # --- Set automatically -------------------------------------------------
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: APP_ENV
        value: production
      - key: HOST                # listen on all interfaces; Render provides PORT itself
        value: 0.0.0.0
      - key: TRUST_PROXY         # Render serves HTTPS in front of the app
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: APP_SECRET_KEY      # random value generated by Render on first deploy
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sspiderr-db
          property: connectionString
      - key: SCHEDULER_TIMEZONE  # when the daily home-page refresh happens (midnight here)
        value: Africa/Lagos
      - key: UPLOAD_RESULTS_RETENTION_DAYS
        value: "30"

      # --- You enter these once in Render (copy from SSPIDERR-APP/.env) -----
      - key: SSPIDERR_SPOTIFY_CLIENT_ID
        sync: false
      - key: SSPIDERR_SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SSPIDERR_SPOTIFY_REDIRECT_URI   # https://<your-service>.onrender.com/callback
        sync: false
      - key: LAST_FM_API_KEY
        sync: false
      - key: NEWS_DATA_API_KEY
        sync: false
      - key: EMAIL_KEY                       # Gmail address that sends contact-form emails
        sync: false
      - key: PASSWORD_KEY                    # that Gmail account's app password
        sync: false
      - key: CONTACT_RECIPIENT               # where feedback arrives
        sync: false

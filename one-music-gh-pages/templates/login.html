{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
    <section class="breadcumb-area bg-img bg-overlay" style="background-image: url('{{ url_for('static', filename='img/bg-img/breadcumb3.jpg') }}');">
        <div class="bradcumbContent">
            <p>Good to see you again</p>
            <h2>Log in</h2>
        </div>
    </section>

    <section class="login-area section-padding-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="login-content">
                        <h3>Welcome back</h3>
                        <div class="login-form">
                            <form action="{{ url_for('auth.login_page') }}" method="post" novalidate>
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                                <div class="form-group">
                                    <label for="login-email">Email address</label>
                                    <input type="email" name="email" class="form-control" id="login-email" placeholder="you@example.com"
                                           value="{{ email }}" required autocomplete="email" autofocus>
                                </div>
                                <div class="form-group">
                                    <label for="login-password">Password</label>
                                    <div style="position:relative">
                                        <input type="password" name="password" class="form-control" id="login-password" placeholder="Password"
                                               required autocomplete="current-password">
                                        <button type="button" class="ss-add-btn" data-toggle-password="login-password"
                                                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:3px 10px">Show</button>
                                    </div>
                                </div>
                                <div class="form-group form-check">
                                    <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
                                    <label class="form-check-label" for="remember">Keep me logged in</label>
                                </div>
                                <button type="submit" class="btn oneMusic-btn mt-30">Log in</button>
                            </form>
                            <p class="ss-alt-link">New to SSPIDERR? <a href="{{ url_for('auth.register_page') }}">Create an account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
{% block scripts %}
<script>
    document.querySelectorAll("[data-toggle-password]").forEach((btn) => {
        btn.addEventListener("click", () => {
            const input = document.getElementById(btn.dataset.togglePassword);
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            btn.textContent = show ? "Hide" : "Show";
        });
    });
</script>
{% endblock %}

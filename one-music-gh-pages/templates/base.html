<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}SSPIDERR - discover the hottest music, then add it to your Spotify playlists, or turn your local songs into a Spotify playlist.{% endblock %}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Discover music{% endblock %} · SSPIDERR</title>
    <link rel="icon" href="{{ url_for('static', filename='img/core-img/my_favicon_com.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sspiderr.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-logged-in="{{ '1' if current_user.is_authenticated else '0' }}"
      data-login-url="{{ url_for('auth.login_page') }}"
      data-create-playlist-url="{{ url_for('library.create_playlist') }}">
    <a class="ss-skip-link" href="#main">Skip to content</a>

    {% include "header.html" %}

    <div id="ss-toasts" class="ss-toasts" aria-live="polite"></div>
    <script type="application/json" id="ss-flashes">{{ get_flashed_messages(with_categories=true) | tojson }}</script>

    <main id="main">
        {% block content %}{% endblock %}
    </main>

    {% include "footer.html" %}

    {# One shared "Add to playlist" picker for every page. Filled by static/js/app.js. #}
    <div class="ss-modal" id="ss-playlist-modal" role="dialog" aria-modal="true" aria-labelledby="ss-playlist-title" aria-hidden="true">
        <div class="ss-modal__dialog">
            <div class="ss-modal__head">
                <h3 id="ss-playlist-title">Add to a playlist</h3>
                <button type="button" class="ss-modal__close" data-close-modal aria-label="Close">&times;</button>
            </div>
            <div class="ss-modal__body" data-playlist-list></div>
            <div class="ss-modal__foot">
                <button type="button" class="ss-btn accent" data-create-playlist><i class="fa fa-plus"></i> New playlist</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery/jquery-2.2.4.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/plugins/plugins.js') }}"></script>
    <script src="{{ url_for('static', filename='js/active.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
